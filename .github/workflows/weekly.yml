name: Weekly Property Listings

on:
  schedule:
    # Every Monday at 11pm UTC = 9am AEST (Sydney winter)
    - cron: "0 23 * * MON"
  workflow_dispatch: # manual trigger allowed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests fpdf

      - name: Run scraper
        run: python scraper.py
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          # Optional: set other search vars here:
          SEARCH_SUBURB: Parramatta
          SEARCH_STATE: NSW
          SEARCH_MAX_PRICE: "500000"
          SEARCH_MIN_BEDS: "1"
          SEARCH_MAX_BEDS: "2"
          SEARCH_MIN_CARSPACES: "1"
          SEARCH_LIMIT: "40"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v3
        with:
          name: parramatta-listings
          path: listings.pdf
